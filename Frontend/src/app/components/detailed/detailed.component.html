<div class="container">
  <h4 class="mb-3">Detailed View</h4>
  <div class="row">
    <!-- Left: Sampling Time List -->
    <div class="col-md-4">
      <ul class="list-group">
        <li
          *ngFor="let item of fullData?.Datas; let i = index"
          (click)="selectedIndex = i"
          class="list-group-item"
          [class.active]="i === selectedIndex"
          style="cursor: pointer;"
        >
          {{ item.SamplingTime }}
        </li>
      </ul>
    </div>

    <!-- Right: Editable Form -->
    <div class="col-md-8" *ngIf="fullData">
      <form>
        <div *ngFor="let prop of fullData.Datas[selectedIndex].Properties" class="mb-3">
          <label class="form-label">{{ prop.Label }}</label>
          <input
            [(ngModel)]="prop.Value"
            [name]="prop.Label"
            class="form-control"
          />
        </div>
        <button type="button" (click)="save()" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
